<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمدجواد نیک‌سرشت | پشتیبانی نوبت‌یار</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b21a8 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* حباب‌های تزئینی پس‌زمینه */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
        }
        body::before {
            width: 300px; height: 300px;
            background: #a855f7;
            top: -100px; right: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: #3b82f6;
            bottom: -150px; left: -150px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 1;
        }
        
        /* عکس پروفایل */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 18px;
            display: block;
            border: 4px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .avatar:hover { transform: scale(1.05); }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 28px;
            line-height: 1.6;
        }
        
        /* بخش هر لینک */
        .link-item {
            margin-bottom: 14px;
            text-align: right;
        }
        
        .link-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 6px;
            padding-right: 8px;
            font-weight: bold;
        }
        
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 16px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }
        
        .link-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .link-btn:active { transform: scale(0.97); }
        
        .link-url {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            direction: ltr;
            text-align: left;
            font-family: monospace;
        }
        
        /* رنگ اختصاصی هر پلتفرم */
        .telegram { border-right: 4px solid #24A1DE; }
        .eitaa { border-right: 4px solid #EF7E22; }
        .rubika { border-right: 4px solid #E63E3E; }
        .phone { border-right: 4px solid #22c55e; }
    </style>
</head>
<body>

    <div class="container">
        <!-- عکس پروفایل: اسم فایل عکست رو جایگزین profile.jpg کن -->
        <img src="profile.jpg" alt="محمدجواد نیک‌سرشت" class="avatar">
        
        <h1>محمدجواد نیک‌سرشت</h1>
        <p class="subtitle">راه‌های ارتباطی با پشتیبانی سایت نوبت‌یار</p>

        <!-- تلگرام -->
        <div class="link-item">
            <div class="link-label">📱 تلگرام</div>
            <a href="https://t.me/Mohammadjavadnikseresht" class="link-btn telegram" target="_blank">
                <span>ارتباط در تلگرام</span>
                <span class="link-url">t.me/Mohammadjavadnikseresht</span>
            </a>
        </div>

        <!-- روبیکا -->
        <div class="link-item">
            <div class="link-label">📞 روبیکا</div>
            <a href="https://rubika.ir/Mohammadjavadnikseresht" class="link-btn rubika" target="_blank">
                <span>ارتباط در روبیکا</span>
                <span class="link-url">rubika.ir/Mohammadjavadnikseresht</span>
            </a>
        </div>

        <!-- ایتا -->
        <div class="link-item">
            <div class="link-label">💬 ایتا</div>
            <a href="https://eitaa.com/Mohammadjavadnikseresht" class="link-btn eitaa" target="_blank">
                <span>ارتباط در ایتا</span>
                <span class="link-url">eitaa.com/Mohammadjavadnikseresht</span>
            </a>
        </div>

        <!-- شماره تلفن -->
        <div class="link-item">
            <div class="link-label">📞 شماره تلفن</div>
            <a href="tel:+989100930304" class="link-btn phone">
                <span>تماس تلفنی</span>
                <span class="link-url">+98 910 093 0304</span>
            </a>
        </div>
    </div>

</body>
</html>
