<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">

    <meta name="description"
          content="محمدجواد نیک سرشت | ارتباط مستقیم و دسترسی سریع به شبکه‌های اجتماعی">

    <title>محمدجواد نیک سرشت</title>

    <!-- فونت -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <!-- آیکون‌ها -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: "Vazirmatn", Tahoma, sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(99, 102, 241, 0.35),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(14, 165, 233, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(168, 85, 247, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #0f172a 45%,
                    #111827 100%
                );

            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND EFFECTS
        ========================= */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent
            );
        }

        .glow {
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(90px);

            opacity: .25;

            pointer-events: none;
        }

        .glow.one {
            top: -100px;
            right: -80px;
            background: #6366f1;
        }

        .glow.two {
            bottom: -120px;
            left: -80px;
            background: #06b6d4;
        }

        /* =========================
           MAIN
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;

            position: relative;

            animation: pageIn .8s ease both;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            position: relative;

            padding: 34px 24px 24px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.12),
                    rgba(255,255,255,.045)
                );

            border: 1px solid rgba(255,255,255,.13);

            box-shadow:
                0 30px 80px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.08);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 12%;
            right: 12%;

            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.6),
                transparent
            );
        }

        /* =========================
           PROFILE
        ========================= */

        .profile {
            text-align: center;
        }

        .avatar-wrap {
            position: relative;

            width: 118px;
            height: 118px;

            margin: 0 auto 20px;
        }

        .avatar-ring {
            position: absolute;
            inset: -5px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #818cf8,
                #38bdf8,
                #a78bfa
            );

            animation: rotateGlow 7s linear infinite;
        }

        .avatar {
            position: relative;

            width: 118px;
            height: 118px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 4px solid #0f172a;

            background: #1e293b;

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);
        }

        .online {
            position: absolute;

            width: 22px;
            height: 22px;

            bottom: 3px;
            left: 5px;

            border-radius: 50%;

            background: #22c55e;

            border: 4px solid #111827;

            box-shadow:
                0 0 15px rgba(34,197,94,.7);
        }

        .name {
            font-size: 27px;

            line-height: 1.5;

            font-weight: 900;

            letter-spacing: -.5px;
        }

        .verified {
            display: inline-flex;

            width: 22px;
            height: 22px;

            align-items: center;
            justify-content: center;

            margin-right: 5px;

            border-radius: 50%;

            font-size: 11px;

            background: #3b82f6;

            color: white;

            vertical-align: middle;

            box-shadow:
                0 5px 15px rgba(59,130,246,.4);
        }

        .welcome {
            max-width: 430px;

            margin: 12px auto 0;

            color: rgba(255,255,255,.68);

            font-size: 14px;

            line-height: 2;

            font-weight: 400;
        }

        /* =========================
           LINKS
        ========================= */

        .links {
            display: grid;

            gap: 12px;

            margin-top: 28px;
        }

        .link {
            position: relative;

            display: flex;

            align-items: center;

            min-height: 64px;

            padding: 10px 14px;

            border-radius: 18px;

            text-decoration: none;

            color: white;

            background:
                rgba(255,255,255,.07);

            border: 1px solid rgba(255,255,255,.09);

            transition:
                transform .25s ease,
                background .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;

            overflow: hidden;
        }

        .link::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.08),
                    transparent
                );

            transform: translateX(-100%);

            transition: transform .5s ease;
        }

        .link:hover::before {
            transform: translateX(100%);
        }

        .link:hover {
            transform: translateY(-3px);

            background:
                rgba(255,255,255,.11);

            border-color:
                rgba(255,255,255,.18);

            box-shadow:
                0 14px 30px rgba(0,0,0,.18);
        }

        .icon {
            width: 44px;
            height: 44px;

            flex: 0 0 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            font-size: 20px;

            margin-left: 12px;

            background: rgba(255,255,255,.1);
        }

        .link-content {
            flex: 1;

            text-align: right;
        }

        .link-title {
            display: block;

            font-size: 14px;

            font-weight: 800;

            margin-bottom: 2px;
        }

        .link-subtitle {
            display: block;

            font-size: 11px;

            color: rgba(255,255,255,.5);

            direction: ltr;

            text-align: right;
        }

        .arrow {
            color: rgba(255,255,255,.4);

            font-size: 12px;

            transition: transform .25s ease;
        }

        .link:hover .arrow {
            transform: translateX(-4px);

            color: white;
        }

        /* =========================
           BRAND COLORS
        ========================= */

        .telegram .icon {
            background: rgba(34,158,217,.18);
            color: #38bdf8;
        }

        .eitaa .icon {
            background: rgba(34,197,94,.15);
            color: #4ade80;
        }

        .rubika .icon {
            background: rgba(168,85,247,.16);
            color: #c084fc;
        }

        .phone .icon {
            background: rgba(245,158,11,.15);
            color: #fbbf24;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 22px;

            color: rgba(255,255,255,.38);

            font-size: 11px;

            line-height: 2;
        }

        .footer a {
            color: rgba(255,255,255,.58);

            text-decoration: none;
        }

        .footer a:hover {
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .page {
                padding: 18px 12px;
            }

            .card {
                padding: 28px 16px 18px;

                border-radius: 27px;
            }

            .avatar-wrap,
            .avatar {
                width: 105px;
                height: 105px;
            }

            .name {
                font-size: 23px;
            }

            .welcome {
                font-size: 13px;

                line-height: 2;
            }

            .link {
                min-height: 60px;

                padding: 8px 12px;
            }

            .icon {
                width: 42px;
                height: 42px;

                flex-basis: 42px;

                margin-left: 10px;
            }
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(25px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        @keyframes rotateGlow {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>
</head>
